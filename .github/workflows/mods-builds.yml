name: Android builds with native mods
# Players of OneShot for Android ask the relay for a game with native mods built in (the phone can't build them:
# their code goes into the game's own functions). Every 15 minutes this reads the sets asked for within the last day
# (the relay's GET /builds, relay/patches/0003) and starts android.yml for each set that has no build yet, or whose
# build is older than the newest android-* release; that run publishes the release android-mods-<key>, which the app
# downloads. At most 3 sets a run; a set whose build is already running is left alone.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: oneshot-mods-builds
  cancel-in-progress: false
env:
  RELAY: 166.1.36.218:7000
jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Start the builds asked for
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! curl -fsS --max-time 15 "http://$RELAY/builds" -o builds.json; then
            echo "The relay does not answer GET /builds (down, or older than relay/patches/0003): nothing to do."
            exit 0
          fi
          gh release list -R "$GITHUB_REPOSITORY" --limit 200 --json tagName -q '.[].tagName' > tags.txt
          gh run list -R "$GITHUB_REPOSITORY" --workflow android.yml --limit 50 --json displayTitle,status \
            -q '.[] | select(.status != "completed") | .displayTitle' > running.txt
          python3 - <<'PY'
          import hashlib, json, re, subprocess, urllib.request
          repo = __import__("os").environ["GITHUB_REPOSITORY"]
          sets = json.load(open("builds.json")).get("builds", [])
          tags = open("tags.txt").read().split()
          running = open("running.txt").read().splitlines()
          plain = max([int(t[8:]) for t in tags if re.fullmatch(r"android-\d+", t)] or [0])
          started = 0
          for mods in sets:
              mods = sorted({m for m in mods if re.fullmatch(r"[a-z0-9_]{1,48}", m)})[:16]
              if not mods:
                  continue
              asked = ",".join(mods)
              key = hashlib.sha256(asked.encode()).hexdigest()[:12]
              if f"Android + mods {asked}" in running:
                  print(f"{asked}: already building")
                  continue
              code = 0
              if f"android-mods-{key}" in tags:
                  try:
                      url = f"https://github.com/{repo}/releases/download/android-mods-{key}/build.txt"
                      text = urllib.request.urlopen(url, timeout=20).read().decode()
                      code = int(re.search(r"^versionCode=(\d+)$", text, re.M).group(1))
                  except Exception as e:
                      print(f"{asked}: build.txt unreadable ({e})")
              if code > plain:
                  print(f"{asked}: built ({code}, newest plain {plain})")
                  continue
              if started == 3:
                  print(f"{asked}: next time (3 started)")
                  continue
              print(f"{asked}: starting a build (built {code or 'never'}, newest plain {plain})")
              subprocess.run(["gh", "workflow", "run", "android.yml", "-R", repo, "-f", "patches=true", "-f", "profile=fast",
                              "-f", "publish=true", "-f", f"mods={asked}"], check=True)
              started += 1
          PY
