name: Build Oneshot Horizon for Android
# A build with native mods is named after them, so the builds workflow (mods-builds.yml) sees one already running.
run-name: ${{ inputs.mods != '' && format('Android + mods {0}', inputs.mods) || 'Android' }}
# Builds an Android APK (arm64) of Horizon by hand. The source is the unofficial Android port of Rayan-XOO
# (MIT; a fork of horizon-rust/horizon with the Android layer: NativeActivity, touch controls, setup screen),
# pinned to a commit, with Oneshot's patches on top when `patches` is on. The APK is a workflow artifact; with
# `publish` on (and the signing secrets set) it is also a release tagged android-<versionCode>, which the app's
# Versions screen offers as an update. Only the newest 5 android-* releases are kept: the PC launcher reads the
# first page of the same release list (launcher-v*, oneshot-*).
# versionCode = 1000 + the run number (the port's own is 36), so every build installs over the previous one.
# Signing: the secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS sign the APK when
# they exist. Without them the APK gets a throwaway debug key, and an install of the next build over it fails
# (uninstall first, and save the worlds: Android erases the app's data with it).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit of Rayan-XOO/horizon to build (empty = the pinned one)
        required: false
        default: ''
      patches:
        description: Apply Oneshot's patches/*.patch (a patch that does not fit is left out and listed)
        type: boolean
        default: false
      profile:
        description: Cargo profile (fast = the port's default; release = slower build, faster game)
        type: choice
        options: [fast, release]
        default: fast
      publish:
        description: Publish the APK as a release for the app's update screen (needs the signing secrets)
        type: boolean
        default: false
      mods:
        description: Native mods of Horizon's registry to build into this APK, by id, comma-separated (empty = none)
        required: false
        default: ''
permissions:
  contents: write
# Plain builds replace each other; a build with native mods (one player's set) never cancels another set's.
concurrency:
  group: oneshot-android-${{ inputs.mods }}
  cancel-in-progress: ${{ inputs.mods == '' }}
env:
  PORT: Rayan-XOO/horizon
  # Data packs (horizon-derived.zip) per port commit: a repository of their own, apart from the builds.
  DATA: A22D3THLEE/oneshot-horizon-data
  # android-port 0.4.5: upstream horizon-rust/horizon 9319ad4 (2026-11-07) plus the Android layer.
  PORT_PINNED: ca93b0b765d3d2749a7b467051c31c43fcce2cf4

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: '0'
      HORIZON_TELEMETRY_URL: 'off'
    steps:
      - uses: actions/checkout@v4
        with:
          path: oneshot
          persist-credentials: false
          # The whole history: the release notes list docs/android-changes.md lines added since the last release.
          fetch-depth: 0
      - name: The port's source
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          sha="${REF:-$PORT_PINNED}"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::ref must be a full 40-hex commit"; exit 1; }
          git init -q src
          cd src
          git remote add origin "https://github.com/$PORT"
          git fetch -q --depth 1 origin "$sha"
          git checkout -q FETCH_HEAD
          git log -1 --oneline
      - name: Oneshot's patches
        if: inputs.patches
        run: |
          set -uo pipefail
          cd src
          git config user.email ci@example.invalid; git config user.name ci
          applied=""; skipped=""
          # Patches of patches/ (each may have its own copy in android-patches/, for another shape of the port's
          # code) and the ones that exist only for Android.
          names=$(cd ../oneshot && ls patches/*.patch android-patches/*.patch | xargs -n1 basename | sort -u)
          for n in $names; do
            p="../oneshot/patches/$n"
            [ -f "../oneshot/android-patches/$n" ] && p="../oneshot/android-patches/$n"
            # An empty Android copy: the patch is PC-only (its Android shape is another android-patches file).
            [ -s "$p" ] || { echo "PC only: $n"; continue; }
            if git apply --whitespace=nowarn "$p"; then applied="$applied $(basename "$p")"; else skipped="$skipped $(basename "$p")"; fi
          done
          echo "applied:$applied"
          echo "skipped:$skipped"
          echo "### Patches" >> "$GITHUB_STEP_SUMMARY"
          echo "applied:${applied:- none}" >> "$GITHUB_STEP_SUMMARY"
          echo "skipped:${skipped:- none}" >> "$GITHUB_STEP_SUMMARY"
      - name: Version
        run: |
          set -euo pipefail
          code=$((1000 + GITHUB_RUN_NUMBER))
          m=src/packaging/android/AndroidManifest.xml
          base=$(grep -o 'android:versionName="[^"]*"' "$m" | head -n1 | cut -d'"' -f2)
          name="$base-os$code"
          sed -i -E "s/android:versionCode=\"[0-9]+\"/android:versionCode=\"$code\"/; s/android:versionName=\"[^\"]*\"/android:versionName=\"$name\"/" "$m"
          grep -q "versionCode=\"$code\"" "$m" || { echo "::error::versionCode was not set"; exit 1; }
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "version: $name ($code)"
      - name: The Horizon data pack
        run: |
          set -euo pipefail
          # The first run downloads horizon-derived.zip (what only Java can make from the game) from the release
          # oneshot-horizon-data publishes for this port commit. Without one the setup screen asks for the file.
          sha=$(git -C src rev-parse HEAD)
          url="https://github.com/$DATA/releases/download/derived-${sha:0:12}/horizon-derived.zip"
          if curl -fsSL -r 0-0 -o /dev/null "$url"; then
            echo "HORIZON_DERIVED_URL=$url" >> "$GITHUB_ENV"
            echo "data pack: $url" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::no data pack for ${sha:0:12} in $DATA (run its workflow first): this APK will ask for horizon-derived.zip"
            echo "data pack: none for ${sha:0:12}" >> "$GITHUB_STEP_SUMMARY"
          fi
      # Native mods (.hnmod) are Rust source put into the game's own functions by horizon-mixins: the phone can't
      # build them, so they are built into the APK here. Each mod is tried on its own and one that doesn't fit this
      # port is left out and named; the rest go in together. Each can be turned off in the game (Options > Mods).
      - name: Native mods
        if: inputs.mods != ''
        env:
          MODS: ${{ inputs.mods }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api=$(grep -oE 'NATIVE_HOOKS_API: u32 = [0-9]+' src/crates/horizon-client/src/game/native_hooks.rs | grep -oE '[0-9]+$')
          commit=$(git -C src rev-parse HEAD)
          echo "Native hooks API: $api, port commit: $commit"
          printf '%s\n' "$MODS" > wanted.txt
          curl -fsSL https://horizon-rust.github.io/horizon-mods/index.json -o index.json
          CONTENT_DIR=content python3 oneshot/tools/pick_mods.py index.json wanted.txt "$api" "$commit" mods try-pinned > picked.txt
          cat picked.txt
          [[ -s picked.txt ]] || { echo "::error::none of the mods can be built: $MODS"; exit 1; }
          # One horizon-mixins for all: the newest of the versions the mods were made with (it reads the older ones).
          rev=""; newest=""
          for r in $(cut -d' ' -f3 picked.txt | sort -u); do
            [[ "$r" =~ ^[0-9a-f]{40}$ ]] || continue
            d=$(gh api "repos/horizon-rust/horizon-mixins/commits/$r" --jq .commit.committer.date)
            if [[ -z "$newest" || "$d" > "$newest" ]]; then newest=$d; rev=$r; fi
          done
          [[ -n "$rev" ]] || { echo "::error::no horizon-mixins version among the mods"; exit 1; }
          echo "horizon-mixins: $rev ($newest)"
          cargo install --git https://github.com/horizon-rust/horizon-mixins --rev "$rev" --locked horizon-mixins-cli --root mixins-tool
          # The port's crate root has an inner #![cfg_attr(...)] (a lint for other systems): horizon-mixins then
          # treats every module of the crate as conditional and finds none of game.rs. On Android it does nothing.
          sed -i '/^#!\[cfg_attr(not(target_os = "android"), forbid(unsafe_code))\]$/d' src/crates/horizon-client/src/lib.rs
          if grep -n '^#!\[cfg' src/crates/*/src/lib.rs; then echo "::warning::crate roots above still have inner cfg attributes"; fi
          # horizon-mixins takes no symlinks in the workspace (the port has CLAUDE.md -> AGENTS.md): files instead.
          find src -type l -not -path 'src/.git/*' -not -path 'src/target/*' | while read -r l; do
            t=$(readlink -f "$l") || true
            if [[ -f "$t" ]]; then cp --remove-destination "$t" "$l"; else rm -f "$l"; fi
          done
          tool=$PWD/mixins-tool/bin/horizon-mixins
          taken=(); : > taken.txt; left=""
          while read -r id version _; do
            rm -rf try && mkdir try
            for k in "${taken[@]}" "$id"; do cp -r "mods/$k" try/; done
            if "$tool" plan --workspace src --mods try --out plan.json > /dev/null 2> plan-error.txt; then
              taken+=("$id"); echo "$id $version" >> taken.txt
            else
              left="$left $id"
              echo "::warning::$id left out: $(head -c 400 plan-error.txt | tr '\n' ' ')"
            fi
          done < picked.txt
          [[ ${#taken[@]} -gt 0 ]] || { echo "::error::no mod fits this port:$left"; exit 1; }
          rm -rf final && mkdir final
          for k in "${taken[@]}"; do cp -r "mods/$k" final/; done
          "$tool" apply --workspace src --mods final --out modded
          # The modded workspace replaces the sources the APK is built from (the .git and build cache stay).
          rsync -a --exclude .git --exclude target modded/ src/
          mods=$(paste -sd';' taken.txt)
          echo "NATIVE_MODS=$mods" >> "$GITHUB_ENV"
          # The content (items, models, sounds) of the mods built in: the game loads it as content mods.
          mkdir -p content-built
          for k in "${taken[@]}"; do [[ -f "content/$k.hmod" ]] && cp "content/$k.hmod" content-built/; done
          echo "NATIVE_LEFT=${left# }" >> "$GITHUB_ENV"
          { echo "### Native mods"; echo "built in: $mods"; echo "left out:${left:- none}"; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Rust and cargo-ndk
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked
          rustc --version
      - name: Android SDK and NDK
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/target
          key: android-${{ inputs.profile }}-${{ hashFiles('src/Cargo.lock') }}
          restore-keys: android-${{ inputs.profile }}-
      - name: The signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ -n "$KS" && -n "$PASS" ]]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "HORIZON_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "HORIZON_KEYSTORE_PASS=$PASS" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
            [[ -n "$ALIAS" ]] && echo "HORIZON_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
            echo "Signing with the project key"
          else
            echo "::warning::No signing secrets: the APK gets a throwaway debug key"
          fi
      - name: Build the APK
        env:
          PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          cd src
          export JAVAC="$JAVA_HOME/bin/javac"
          ./packaging/android/build_apk.sh
          cd target/android
          sha256sum horizon.apk | tee horizon.apk.sha256
          {
            echo "### APK"
            echo "port commit: $(git -C ../.. rev-parse HEAD 2>/dev/null || echo "$PORT_PINNED")"
            echo "version: $VERSION_NAME ($VERSION_CODE)"
            echo "profile: $PROFILE, patches: ${{ inputs.patches }}, signed: ${SIGNED:-no (debug key)}"
            echo "sha256: $(cut -d' ' -f1 horizon.apk.sha256)"
            echo "size: $(stat -c %s horizon.apk) bytes"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: horizon-android-${{ inputs.profile }}${{ inputs.patches && '-oneshot' || '' }}
          path: |
            src/target/android/horizon.apk
            src/target/android/horizon.apk.sha256
          retention-days: 14
      - name: Publish the release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          PATCHES: ${{ inputs.patches }}
          MODS_ASKED: ${{ inputs.mods }}
        run: |
          set -euo pipefail
          if [[ -z "${SIGNED:-}" ]]; then
            echo "::error::publish needs the signing secrets: an APK with a throwaway key updates nobody"; exit 1
          fi
          sha=$(cut -d' ' -f1 src/target/android/horizon.apk.sha256)
          # An APK with native mods is one player's: never the update everyone is offered, but a release of its
          # own, android-mods-<key> (key: SHA-256 of the asked ids, sorted, comma-joined, first 12 hex), replaced
          # by each new build of the same set. The app reads its build.txt to know it is ready.
          if [[ -n "${NATIVE_MODS:-}" ]]; then
            asked=$(printf '%s\n' "$MODS_ASKED" | tr ',' '\n' | sed 's/[[:space:]]//g' | { grep -E '^[a-z0-9_]+$' || true; } | sort -u | paste -sd',')
            key=$(printf '%s' "$asked" | sha256sum | cut -c1-12)
            tag="android-mods-$key"
            content=$(cd content-built && ls *.hmod 2>/dev/null | paste -sd',' || true)
            printf 'versionCode=%s\nversionName=%s\nsha256=%s\nasked=%s\nmods=%s\nleft=%s\ncontent=%s\n' \
              "$VERSION_CODE" "$VERSION_NAME" "$sha" "$asked" "$NATIVE_MODS" "${NATIVE_LEFT:-}" "$content" > build.txt
            cat build.txt
            files=(src/target/android/horizon.apk src/target/android/horizon.apk.sha256 build.txt)
            for f in content-built/*.hmod; do [[ -e "$f" ]] && files+=("$f"); done
            gh release delete "$tag" -R "$GITHUB_REPOSITORY" -y --cleanup-tag 2>/dev/null || true
            gh release create "$tag" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "OneShot Android $VERSION_NAME + $asked" \
              --notes "OneShot for Android with native mods built in, for the players who asked for: $asked" \
              "${files[@]}"
            echo "release: $tag" >> "$GITHUB_STEP_SUMMARY"
            # Keep the 20 newest sets: the PC launcher reads the first page of the release list.
            gh release list -R "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt -q '.[] | select(.tagName | startswith("android-mods-")) | .createdAt + " " + .tagName' \
              | sort -r | tail -n +21 | cut -d' ' -f2 \
              | while read -r old; do gh release delete "$old" -R "$GITHUB_REPOSITORY" -y --cleanup-tag; done
            exit 0
          fi
          tag="android-$VERSION_CODE"
          # What is new: the "- " lines of docs/android-changes.md added since the commit of the newest
          # android-* release (the first 12 when that commit is unknown); the app shows them on start.
          prev=$(gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName -q '.[].tagName' \
            | { grep -E '^android-[0-9]+$' || true; } | sort -t- -k2 -n -r | head -n 1)
          base=""
          if [[ -n "$prev" ]]; then
            base=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$prev" -q .target_commitish 2>/dev/null || true)
            [[ -n "$base" ]] && { git -C oneshot cat-file -e "$base^{commit}" 2>/dev/null || base=""; }
          fi
          if [[ -n "$base" ]]; then
            changes=$(git -C oneshot diff "$base" HEAD -- docs/android-changes.md | { grep -E '^\+- ' || true; } | sed 's/^+//')
          else
            changes=$({ grep -E '^- ' oneshot/docs/android-changes.md || true; } | head -n 12)
          fi
          whatsnew=""
          if [[ -n "$changes" ]]; then whatsnew="Что нового:"$'\n'"$changes"$'\n\n'; fi
          notes=$(printf 'OneShot for Android %s\n\n%sversionCode: %s\nversionName: %s\nsha256: %s\nport commit: %s\npatches: %s\n' \
            "$VERSION_NAME" "$whatsnew" "$VERSION_CODE" "$VERSION_NAME" "$sha" "$(git -C src rev-parse HEAD)" "$PATCHES")
          gh release create "$tag" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "OneShot Android $VERSION_NAME" \
            --notes "$notes" src/target/android/horizon.apk src/target/android/horizon.apk.sha256
          echo "release: $tag" >> "$GITHUB_STEP_SUMMARY"
          # Keep the newest 5 android-* releases.
          gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName -q '.[].tagName' \
            | { grep -E '^android-[0-9]+$' || true; } | sort -t- -k2 -n -r | tail -n +6 \
            | while read -r old; do gh release delete "$old" -R "$GITHUB_REPOSITORY" -y --cleanup-tag; done
