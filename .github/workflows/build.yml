name: Build Oneshot Horizon
# Builds Horizon's Windows game with Oneshot's patches (patches/*.patch) for every new release of Horizon, the way
# Horizon's own game-build.yml builds it (MSVC, the C runtime linked in, HORIZON_VERSION / HORIZON_NIGHTLY), and
# publishes it as a release named after the official program it replaces:
#   tag  oneshot-<first 16 hex of the SHA-256 of the official horizon-client.exe>
#   assets  horizon-client-oneshot.zip (horizon-client.exe) and build.txt (base, sha256, features, horizon tag)
# Oneshot Launcher computes that SHA-256 for an installed version and downloads the matching release.
on:
  schedule:
    - cron: '23 */4 * * *'
  # A change to the patches rebuilds the newest releases with them.
  push:
    branches: [main]
    paths: ['patches/**', 'mods.txt', 'tools/**', '.github/workflows/build.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: A Horizon release tag to build (empty = the newest nightly and the newest stable not built yet)
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: oneshot-build
  cancel-in-progress: false
env:
  UPSTREAM: horizon-rust/horizon

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
      patches: ${{ steps.plan.outputs.patches }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          # The set of patches: a release built with another set is built again.
          export PATCHES=$(cat patches/*.patch mods.txt tools/*.py .github/workflows/build.yml | sha256sum | cut -c1-16)
          echo "patches=$PATCHES" >> "$GITHUB_OUTPUT"
          gh api "repos/$UPSTREAM/releases?per_page=60" > upstream.json
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate > ours.json || echo '[]' > ours.json
          python3 - <<'PY'
          import json, os, re
          upstream = json.load(open('upstream.json'))
          ours = {r['tag_name'] for r in json.load(open('ours.json'))}
          built = {r.get('body', '') for r in json.load(open('ours.json'))}
          want = os.environ.get('WANT', '').strip()
          def windows(r):
              return any(a['name'] == 'horizon-windows-x64.zip' for a in r.get('assets', []))
          rel = [r for r in upstream if not r.get('draft') and windows(r)]
          def source_commit(r):
              # "Source: commit <sha>" in the notes is the commit the release was built from; the rolling `nightly`
              # release is rebuilt in place, so its target_commitish can be stale.
              m = re.search(r'Source: commit ([0-9a-f]{40})', r.get('body') or '')
              if m:
                  return m.group(1)
              c = r.get('target_commitish', '')
              return c if re.fullmatch(r'[0-9a-f]{40}', c) else r['tag_name']
          if want:
              picks = [r for r in rel if r['tag_name'] == want]
          else:
              # The launchers install the rolling `nightly` release (a day can have several nightlies; only the first
              # gets a dated tag), so the newest of it and the dated ones is built.
              nightly = [r for r in rel if r['tag_name'] == 'nightly' or re.fullmatch(r'nightly-\d{4}-\d{2}-\d{2}', r['tag_name'])]
              stable = [r for r in rel if re.fullmatch(r'v\d+\.\d+\.\d+', r['tag_name'])]
              key = lambda r: r['published_at']
              picks = sorted(nightly, key=key, reverse=True)[:1] + sorted(stable, key=key, reverse=True)[:1]
          jobs = []
          for r in picks:
              tag = r['tag_name']
              commit = source_commit(r)
              # Already built from this commit with these patches (the release notes name both): skip.
              patches = os.environ['PATCHES']
              if not want and any(f'horizon commit: {commit}\n' in (b or '') and f'patches: {patches}' in (b or '') for b in built):
                  continue
              if tag.startswith('v'):
                  version, nightly_label = tag[1:], ''
              else:
                  m = re.search(r'(\d{4}-\d{2}-\d{2})', r.get('name') or '') or re.search(r'(\d{4}-\d{2}-\d{2})', tag)
                  date = m.group(1)
                  version, nightly_label = f'nightly-{date}', f'{date} {commit[:7]}'
              jobs.append({'tag': tag, 'commit': commit, 'version': version, 'nightly': nightly_label})
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('matrix=' + json.dumps({'include': jobs}) + '\n')
              out.write('any=' + ('true' if jobs else 'false') + '\n')
          print(json.dumps(jobs, indent=2))
          PY

  build:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: build ${{ matrix.tag }}
    runs-on: windows-latest
    timeout-minutes: 300
    env:
      RUSTFLAGS: -C target-feature=+crt-static
      HORIZON_VERSION: ${{ matrix.version }}
      HORIZON_NIGHTLY: ${{ matrix.nightly }}
      CARGO_TERM_COLOR: never
    defaults:
      run:
        shell: bash
    steps:
      # Windows runners turn LF into CRLF on checkout, which would keep the patches from applying.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          path: oneshot
      - name: The official build of this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "${{ matrix.tag }}" -R "$UPSTREAM" -p horizon-windows-x64.zip -D official
          (cd official && unzip -q horizon-windows-x64.zip)
          exe=$(find official -name horizon-client.exe | head -1)
          base=$(sha256sum "$exe" | cut -d' ' -f1)
          echo "BASE=$base" >> "$GITHUB_ENV"
          echo "Official horizon-client.exe: $base"
          # The rolling nightly may have been rebuilt since the plan: a build must come from the official program's commit.
          version=$("$exe" --version 2>&1 | head -1 || true)
          echo "Official version: $version"
          commit="${{ matrix.commit }}"
          if [[ -n "${{ matrix.nightly }}" && "$version" != *"${commit:0:7}"* ]]; then
            echo "::notice::${{ matrix.tag }} is now $version, not ${commit:0:7}; the next run builds it"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - name: Horizon's source at the release's commit
        if: env.SKIP != '1'
        run: |
          set -euo pipefail
          git init -q src
          cd src
          git remote add origin "https://github.com/$UPSTREAM"
          git fetch -q --depth 1 origin "${{ matrix.commit }}"
          git checkout -q FETCH_HEAD
          git log -1 --oneline
      # A release older than the patches (its code differs where they change it) gets no build: the launcher plays
      # the official game for it, so that is no failure.
      - name: Oneshot's patches
        if: env.SKIP != '1'
        run: |
          set -euo pipefail
          cd src
          # Each patch is a feature, named after its file (0001-skin-share.patch: skin-share). One that no longer fits
          # this release is left out and the build has the others; without the first (the reason for the build) there
          # is no build for this release, and the launcher plays the official game.
          features=""
          for p in ../oneshot/patches/*.patch; do
            name=$(basename "$p" .patch); feature=${name#*-}
            if git apply --whitespace=nowarn "$p"; then
              echo "Applied $name"; features="${features:+$features,}$feature"
            elif [[ "$name" == 0001-* ]]; then
              echo "::notice::$name does not apply to ${{ matrix.tag }}; no Oneshot build for it"
              echo "SKIP=1" >> "$GITHUB_ENV"; exit 0
            else
              echo "::warning::$name does not apply to ${{ matrix.tag }}; built without $feature"
            fi
          done
          echo "FEATURES=$features" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        if: env.SKIP != '1'
      - uses: Swatinem/rust-cache@v2
        if: env.SKIP != '1'
        with:
          workspaces: src
          shared-key: oneshot-windows
      - name: Build the game
        if: env.SKIP != '1'
        run: |
          set -euo pipefail
          cd src
          cargo build --release --locked -p horizon-client --bin horizon-client
          ./target/release/horizon-client.exe --version || true
      - name: Publish
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out=$PWD/out
          mkdir -p "$out"
          cp src/target/release/horizon-client.exe "$out/horizon-client.exe"
          # Horizon's MIT license goes with every copy of the program.
          cp src/LICENSE "$out/LICENSE-HORIZON.txt"
          sha=$(sha256sum "$out/horizon-client.exe" | cut -d' ' -f1)
          printf 'base=%s\nsha256=%s\nfeatures=%s\nhorizon=%s\n' "$BASE" "$sha" "$FEATURES" "${{ matrix.version }}" > "$out/build.txt"
          (cd "$out" && 7z a -tzip -mx=9 horizon-client-oneshot.zip horizon-client.exe LICENSE-HORIZON.txt > /dev/null)
          tag="oneshot-${BASE:0:16}"
          notes=$(printf 'Oneshot build of Horizon %s (commit %s), features: %s\n\nhorizon tag: %s\nhorizon commit: %s\nbase: %s\nsha256: %s\npatches: %s\n' \
            "${{ matrix.version }}" "${{ matrix.commit }}" "$FEATURES" "${{ matrix.tag }}" "${{ matrix.commit }}" "$BASE" "$sha" "${{ needs.plan.outputs.patches }}")
          gh release delete "$tag" -R "$GITHUB_REPOSITORY" -y --cleanup-tag 2>/dev/null || true
          gh release create "$tag" -R "$GITHUB_REPOSITORY" --title "Horizon ${{ matrix.version }} + Oneshot" --notes "$notes" \
            "$out/horizon-client-oneshot.zip" "$out/build.txt"
      # OneShot + mods: the same game with popular native mods from Horizon's registry (mods.txt) built in, so
      # players get them without building the game themselves. Mods are added one at a time and each that no longer
      # fits this Horizon is left out; when the whole set fails, there is no such build and the plain one stands.
      - name: OneShot + mods
        if: env.SKIP != '1'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api=$(grep -oE 'NATIVE_HOOKS_API: u32 = [0-9]+' src/crates/horizon-client/src/game/native_hooks.rs | grep -oE '[0-9]+$')
          echo "Native hooks API: $api"
          curl -fsSL https://horizon-rust.github.io/horizon-mods/index.json -o index.json
          python oneshot/tools/pick_mods.py index.json oneshot/mods.txt "$api" "${{ matrix.commit }}" mods > picked.txt
          cat picked.txt
          [[ -s picked.txt ]] || { echo "::warning::no mods to build"; exit 0; }
          # horizon-mixins stages no symbolic links (the source has a few, such as CLAUDE.md): they aren't code.
          find src -path src/target -prune -o -type l -print -exec rm -f {} +
          rev=$(head -1 picked.txt | cut -d' ' -f3)
          cargo install --git https://github.com/horizon-rust/horizon-mixins --rev "$rev" --locked horizon-mixins-cli --root mixins-tool
          tool=$PWD/mixins-tool/bin/horizon-mixins
          taken=()
          while read -r id version _; do
            rm -rf try && mkdir try
            for k in "${taken[@]}" "$id"; do cp -r "mods/$k" try/; done
            if "$tool" plan --workspace src --mods try --out plan.json > /dev/null 2> plan-error.txt; then
              taken+=("$id"); echo "$id $version" >> taken.txt
            else
              echo "::warning::$id left out: $(head -c 400 plan-error.txt | tr '\n' ' ')"
            fi
          done < picked.txt
          [[ ${#taken[@]} -gt 0 ]] || { echo "::warning::no mod fits this Horizon"; exit 0; }
          rm -rf final && mkdir final
          for k in "${taken[@]}"; do cp -r "mods/$k" final/; done
          "$tool" apply --workspace src --mods final --out modded
          # The compiler's errors go to the run's annotations too: they are what to fix when a mod stops building.
          if ! (cd modded && CARGO_TARGET_DIR=../target-mods cargo build --release --locked -p horizon-client --bin horizon-client --message-format short 2> ../build-mods.txt); then
            cat build-mods.txt | tail -40
            # Show the generated code at the failing line: it tells which mod's injection does not fit.
            loc=$(grep -m1 -oE 'crates[^ ]*game\.rs:[0-9]+' build-mods.txt || true)
            if [[ -n "$loc" ]]; then
              f=${loc%%:*}; n=${loc##*:}; f=${f//\//}
              sed -n "$((n-6)),$((n+2))p" "modded/$f" | while IFS= read -r line; do echo "::warning::code: ${line:0:300}"; done
            fi
            grep -E '(error|warning: unused)' build-mods.txt | grep -v '^warning: build failed' | head -15 | while IFS= read -r line; do echo "::warning::${line:0:900}"; done
            exit 1
          fi
          out=$PWD/out-mods
          mkdir -p "$out"
          cp target-mods/release/horizon-client.exe "$out/horizon-client.exe"
          cp src/LICENSE "$out/LICENSE-HORIZON.txt"
          sha=$(sha256sum "$out/horizon-client.exe" | cut -d' ' -f1)
          mods=$(paste -sd';' taken.txt)
          printf 'base=%s\nsha256=%s\nfeatures=%s,mods\nhorizon=%s\nmods=%s\n' "$BASE" "$sha" "$FEATURES" "${{ matrix.version }}" "$mods" > "$out/build.txt"
          (cd "$out" && 7z a -tzip -mx=9 horizon-client-oneshot.zip horizon-client.exe LICENSE-HORIZON.txt > /dev/null)
          tag="oneshot-mods-${BASE:0:16}"
          notes=$(printf 'Oneshot build of Horizon %s (commit %s) with native mods from the Horizon registry: %s\n\nhorizon tag: %s\nhorizon commit: %s\nbase: %s\nsha256: %s\npatches: %s\n' \
            "${{ matrix.version }}" "${{ matrix.commit }}" "$mods" "${{ matrix.tag }}" "${{ matrix.commit }}" "$BASE" "$sha" "${{ needs.plan.outputs.patches }}")
          gh release delete "$tag" -R "$GITHUB_REPOSITORY" -y --cleanup-tag 2>/dev/null || true
          gh release create "$tag" -R "$GITHUB_REPOSITORY" --title "Horizon ${{ matrix.version }} + Oneshot + mods" --notes "$notes" \
            "$out/horizon-client-oneshot.zip" "$out/build.txt"
